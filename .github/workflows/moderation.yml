name: triggerHappy - Discussion Moderation Tool

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  discussions: write   # close discussions, post comments
  contents: write      # write back to banned.yml / strikes.yml

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:

      - name: DEBUG dump raw discussion body
        env:
          BODY: ${{ toJSON(github.event.discussion.body) }}
        run: echo "$BODY"

    
      - uses: erstarr/triggerhappy@main # TODO remember to bumb when publishing first stable ver
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          storage_token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          storage_repo: erstarr/test_discussionModeration_SERVER_LOCATION
          # optional - only needed if you move the files elsewhere
          # config_path:  .github/discussion_moderator/config.yml
          # banned_path:  .github/discussion_moderator/banned.yml
          # strikes_path:    .github/discussion_moderator/strikes.yml

          auto_close_categories: "General"
          # If you want to enable strikes, specify the number of strikes a user can receive before they are banned
          strikes_to_ban:  4
                    
          # If you want to enable auto format-enforcement, provide a regex to match against
          auto_close_regex: '[\s\S]*\#\#\#\ I\ acknowledge\ that:\n\n\-\ \[X\]\ I\ have\ searched\ \*\*all\*\*\ \(open\ and\ closed\)\ discussions\ and\ issues\ and\ my\ problem\ is\ not\ there\.\n\-\ \[X\]\ I\ have\ read\ the\ \[Code\ of\ Conduct\]\(https://github\.com/hyprwm/\.github/blob/main/policies/CODE_OF_CONDUCT\.md\)\ and\ agree\ to\ follow\ it\.\n\-\ \[X\]\ I\ wrote\ this\ request\ with\ my\ own\ hands,\ my\ own\ keyboard,\ and\ in\ my\ own\ words\.\s*\Z'
          
          # Shall discussion authors that didn't obey the format receive strikes for it -- uses the strikes_to_ban quota like normal strikes
          strike_per_nonFormat: True
